<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin — Produtos Tio Luiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h4 mb-1 text-center" style="color: var(--admin-primary);">Painel Admin</h1>
            <p class="text-muted text-center small mb-4">Produtos Tio Luiz</p>

            <form id="login-form" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" id="email" class="form-control" required autocomplete="username">
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Senha</label>
                <input type="password" id="password" class="form-control" required autocomplete="current-password">
              </div>
              <button type="submit" id="login-btn" class="btn btn-primary w-100">Entrar</button>
              <div id="error" class="alert alert-danger mt-3 d-none small mb-0"></div>
            </form>
          </div>
          <div class="card-footer text-center small">
            <a href="../index.html" class="text-muted text-decoration-none">← Voltar ao site</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { login, getCurrentUser } from "../assets/js/auth.js";

    // Se já logado, manda direto pro painel
    getCurrentUser().then((user) => {
      if (user) window.location.replace("painel.html");
    });

    const form = document.getElementById("login-form");
    const btn = document.getElementById("login-btn");
    const errEl = document.getElementById("error");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      if (!email || !password) return;

      errEl.classList.add("d-none");
      btn.disabled = true;
      btn.textContent = "Entrando...";
      try {
        await login(email, password);
        window.location.replace("painel.html");
      } catch (err) {
        const msg = err.code === "auth/invalid-credential" || err.code === "auth/invalid-login-credentials"
          ? "E-mail ou senha inválidos."
          : err.message || "Erro ao entrar.";
        errEl.textContent = msg;
        errEl.classList.remove("d-none");
        btn.disabled = false;
        btn.textContent = "Entrar";
      }
    });
  </script>

</body>
</html>
