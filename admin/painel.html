<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel — Produtos Tio Luiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar-admin d-flex justify-content-between align-items-center">
    <a href="../index.html" class="brand">Tio Luiz · Painel Admin</a>
    <div class="d-flex align-items-center gap-3">
      <span id="user-email" class="text-muted small"></span>
      <button id="logout-btn" class="btn btn-outline-secondary btn-sm">Sair</button>
    </div>
  </nav>

  <div class="container-fluid py-4">

    <!-- Toolbar -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
      <div class="d-flex align-items-center gap-2">
        <label for="filtro-categoria" class="form-label mb-0 small">Categoria:</label>
        <select id="filtro-categoria" class="form-select form-select-sm" style="width:auto;min-width:180px;">
          <option value="">Todas</option>
        </select>
        <input id="filtro-busca" type="search" class="form-control form-control-sm" placeholder="Buscar por nome..." style="width:240px;">
      </div>
      <div class="d-flex align-items-center gap-2">
        <span id="contagem" class="small text-muted"></span>
        <button id="novo-btn" class="btn btn-primary btn-sm">+ Novo produto</button>
      </div>
    </div>

    <!-- Tabela -->
    <div class="card-table">
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th style="width:64px;"></th>
              <th>Nome</th>
              <th>Categoria</th>
              <th>Embalagem</th>
              <th class="text-center" style="width:90px;">Ordem</th>
              <th class="text-center" style="width:110px;">Ativo</th>
              <th class="text-center" style="width:110px;">Destaque</th>
              <th class="text-end" style="width:160px;">Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-body">
            <tr>
              <td colspan="8" class="state-message">Carregando...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Modal de edição -->
  <div class="modal fade" id="produto-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="produto-form" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="modal-titulo">Novo produto</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="produto-id">
            <div class="row g-3">
              <div class="col-md-8">
                <label class="form-label">Nome *</label>
                <input id="produto-nome" type="text" class="form-control" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Categoria *</label>
                <select id="produto-categoria" class="form-select" required></select>
              </div>
              <div class="col-md-8">
                <label class="form-label">Descrição</label>
                <input id="produto-descricao" type="text" class="form-control">
              </div>
              <div class="col-md-4">
                <label class="form-label">Embalagem</label>
                <input id="produto-embalagem" type="text" class="form-control" placeholder="500 g">
              </div>
              <div class="col-md-8">
                <label class="form-label">URL da imagem</label>
                <input id="produto-imagem" type="text" class="form-control" placeholder="assets/images/produto.webp">
                <div class="form-text">Caminho relativo enquanto Storage não está ativo (Fase 5).</div>
              </div>
              <div class="col-md-4">
                <label class="form-label">Ordem</label>
                <input id="produto-ordem" type="number" class="form-control" value="1" min="0">
              </div>
              <div class="col-md-8">
                <label class="form-label">Nome curto <span class="text-muted small">(opcional — badge dos pet-cards)</span></label>
                <input id="produto-nome-curto" type="text" class="form-control">
              </div>
              <div class="col-md-4 d-flex flex-column justify-content-end gap-2">
                <div class="form-check">
                  <input id="produto-ativo" type="checkbox" class="form-check-input" checked>
                  <label class="form-check-label" for="produto-ativo">Ativo</label>
                </div>
                <div class="form-check">
                  <input id="produto-destaque" type="checkbox" class="form-check-input">
                  <label class="form-check-label" for="produto-destaque">Destaque</label>
                </div>
              </div>
            </div>
            <div id="form-erro" class="alert alert-danger mt-3 d-none small mb-0"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary" id="salvar-btn">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Toasts (mensagens flutuantes) -->
  <div class="toast-area" id="toast-area"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../assets/js/admin-painel.js"></script>

</body>
</html>
